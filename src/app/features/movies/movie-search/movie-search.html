<form role="search" class="flex gap-2" (submit)="onSubmit($event)">
  <div class="relative flex-1">
    <label for="movie-search" class="sr-only">Название фильма</label>
    <input
      id="movie-search"
      type="search"
      autocomplete="off"
      placeholder="Найти фильм, например «Матрица»"
      [value]="term()"
      (input)="onInput($event)"
      (keydown.escape)="clear()"
      class="w-full rounded-lg border border-white/10 bg-slate-900 py-2.5 pl-4 pr-10 text-slate-100 placeholder:text-slate-500 focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/30 [&::-webkit-search-cancel-button]:hidden"
    />
    @if (term()) {
      <button
        type="button"
        (click)="clear()"
        aria-label="Очистить поиск"
        class="absolute inset-y-0 right-0 flex w-10 items-center justify-center text-xl text-slate-500 transition hover:text-slate-200"
      >
        &times;
      </button>
    }
  </div>
  <button
    type="submit"
    class="rounded-lg bg-amber-400 px-5 py-2.5 font-semibold text-slate-950 transition hover:bg-amber-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400"
  >
    Поиск
  </button>
</form>
