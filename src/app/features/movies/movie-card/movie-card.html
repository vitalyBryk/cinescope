<a
  [routerLink]="['/movie', movie().id]"
  class="group flex h-full flex-col overflow-hidden rounded-xl bg-slate-900 ring-1 ring-white/10 transition hover:ring-white/30 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400"
>
  <div class="relative aspect-[2/3] overflow-hidden bg-slate-800">
    @if (movie().poster_path | tmdbImage: 'w342'; as poster) {
      <img
        [src]="poster"
        [alt]="'Постер: ' + movie().title"
        loading="lazy"
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full items-center justify-center p-4 text-center text-sm text-slate-500">
        Нет постера
      </div>
    }

    @if (hasRating()) {
      <span
        class="absolute left-2 top-2 rounded-md px-1.5 py-0.5 text-xs font-bold shadow"
        [class]="ratingClass()"
      >
        {{ movie().vote_average | number: '1.1-1' }}
      </span>
    }
  </div>

  <div class="flex flex-1 flex-col gap-1.5 p-3">
    <h2 class="line-clamp-2 font-semibold leading-snug text-slate-100">{{ movie().title }}</h2>
    @if (year(); as year) {
      <p class="text-xs text-slate-400">{{ year }}</p>
    }
    <p class="line-clamp-3 text-sm text-slate-400">
      {{ movie().overview || 'Описание отсутствует.' }}
    </p>
  </div>
</a>
